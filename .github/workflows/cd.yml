# CD: byg Docker image, push til GitHub Container Registry, deploy på VM via SSH.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST  - VM'ens IP
#   SSH_USER  - bruger på VM'en (skal kunne køre docker)
#   SSH_KEY   - privat SSH-nøgle (den offentlige ligger i ~/.ssh/authorized_keys på VM'en)

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tek2-demo-app

jobs:
  # Dockerfilen bygger med -DskipTests, så testene skal køre her.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven # kort form af actions/cache
      - run: mvn -B verify

  build-and-push:
    needs: test # intet image hvis testene fejler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # må pushe til ghcr.io
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha # Docker-lag caches i GitHub Actions
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push # venter på at image er pushet
    # Kun ved manuel kørsel: push giver et image klar til release (continuous delivery).
    # Fjernes linjen, deployer hvert push automatisk (continuous deployment).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          install -m 600 /dev/null key && echo "$SSH_KEY" > key
          scp -i key -o StrictHostKeyChecking=accept-new compose.prod.yaml "$TARGET":~/compose.prod.yaml
          ssh -i key "$TARGET" "GHCR_OWNER=${{ github.repository_owner }} docker compose -f compose.prod.yaml pull && \
                                GHCR_OWNER=${{ github.repository_owner }} docker compose -f compose.prod.yaml up -d"
